# ── Compute injection mode ────────────────────────────────────────────────────
compute_mode:
  midcomm:
    midcomm_flag: ""           # comb_with_compute enables mid-comm by default
    backend_mode: both

  no_midcomm:
    midcomm_flag: ""
    backend_mode: both
    binary_overrides:
      intelmpi: *intelmpi_no_midcomm
      intelmpi_tcp: *intelmpi_no_midcomm
      openmpi: *openmpi_no_midcomm
      mpich: *mpich_no_midcomm

# ── Communication options (shared across all cases) ───────────────────────────
comm:
  post_recv: wait_all
  post_send: wait_all
  # wait_recv / wait_send are varied per case below

# ── SLURM resource config ─────────────────────────────────────────────────────
slurm:
  clusters: cm4
  partition: cm4_std
  qos: cm4_std
  runtime_cpus_per_rank: 24
  total_cpus_per_job: 112
  time: "00:30:00"

# ── Cases: inner loop inside each SLURM script ───────────────────────────────
