# ── Node / rank topology ──────────────────────────────────────────────────────
topology:
  - name: 1n2r_c24           # 1 node × 2 ranks/node, 24 cpus/rank used at runtime (112 cpus reserved/job)
    nodes: 1
    ntasks_per_node: 2
    cpus_per_task: 56
    divide: "2_1_1"
    # Optional per-grid dummy-compute targets in microseconds. Values here
    # override grid.compute_target_us for this topology.
    compute_target_us:
      large: 8000
      medium: 1000
      small_msg: 20

  - name: 2n2r_c24           # 2 nodes × 1 rank/node, 24 cpus/rank used at runtime (112 cpus reserved/job)
    nodes: 2
    ntasks_per_node: 1
    cpus_per_task: 56
    divide: "2_1_1"
    compute_target_us:
      large: 12000
      medium: 2000
      small_msg: 30

  - name: 2n4r_c24           # 2 nodes × 2 ranks/node, 24 cpus/rank used at runtime (112 cpus reserved/job)
    nodes: 2
    ntasks_per_node: 2
    cpus_per_task: 28
    divide: "2_2_1"
    compute_target_us: {}

  - name: 4n4r_c24           # 4 nodes × 1 rank/node, 24 cpus/rank used at runtime (112 cpus reserved/job)
    nodes: 4
    ntasks_per_node: 1
    cpus_per_task: 28
    divide: "2_2_1"
    compute_target_us: {}

# ── Grid / halo message-size tiers ────────────────────────────────────────────
grid:
  # Keep a distinct key so historical generated/.../small results are not overwritten.
  small_msg:
    label: "small"
    size: "32_32_32"
    ghost: "1_1_1"
    periodic: "1_1_1"
    vars: 1
    cutoff: 250
    compute_target_us: 50
    cycles: 5

  medium:
    label: "medium"
    size: "128_128_128"
    ghost: "4_4_4"
    periodic: "1_1_1"
    vars: 3
    cutoff: 250
    compute_target_us: 3000
    cycles: 100

  large:
    label: "large"
    size: "256_256_256"
    ghost: "4_4_4"
    periodic: "1_1_1"
    vars: 3
    cutoff: 250
    compute_target_us: 8000
    cycles: 20

