# ─────────────────────────────────────────────────────────────────────────────
# mpi_lab experiment config – Comb async scan on CoolMUC-4
# Usage: python mpi_lab.py preview --config config/comb_cm4.yaml
# ─────────────────────────────────────────────────────────────────────────────

name: comb_async_scan
output_base: ../generated   # relative to this config file

# ── Binary paths (edit here) ────────────────────────────────────────────────
paths:
  intelmpi_midcomm: &intelmpi_midcomm "/dss/dsshome1/02/ge63neh3/comb_with_compute/build_1_intel_dummy_com_OMP/bin/comb"
  intelmpi_no_midcomm: &intelmpi_no_midcomm "/dss/dsshome1/02/ge63neh3/comb_with_compute/build_1_intel_dummy_com_OMP/bin/comb"
  openmpi_midcomm: &openmpi_midcomm "/dss/dsshome1/02/ge63neh3/comb_with_compute/build_2_openmpi_dummy_OMP/bin/comb"
  openmpi_no_midcomm: &openmpi_no_midcomm "/dss/dsshome1/02/ge63neh3/comb_with_compute/build_2_openmpi_dummy_OMP/bin/comb"
  mpich_midcomm: &mpich_midcomm "/dss/dsshome1/02/ge63neh3/comb_with_compute/build_3_mpich_dummy_OMP/bin/comb"
  mpich_no_midcomm: &mpich_no_midcomm "/dss/dsshome1/02/ge63neh3/comb_with_compute/build_3_mpich_dummy_OMP/bin/comb"

# ── MPI implementations ───────────────────────────────────────────────────────
mpi_impl:
  intelmpi:
    modules:
      - stack/24.4.0
      - intel-mpi/2021.16.0
    modules_unload:
      - openmpi/4.1.7-gcc13
    binary: *intelmpi_midcomm
    template: comb_intelmpi.slurm.j2
    protocol_env:
      I_MPI_FABRICS: "shm:ofi"
      I_MPI_OFI_PROVIDER: "verbs"
      I_MPI_HYDRA_IFACE: "ib0.8001"
      I_MPI_DEBUG: "5"
    async_env: I_MPI_ASYNC_PROGRESS
    async_threads_env: I_MPI_ASYNC_PROGRESS_THREADS
    async_pin_env: I_MPI_ASYNC_PROGRESS_PIN
    async_threads: 1
    # Per-MPI, per-topology, per-grid overrides in microseconds.
    compute_target_us:
      1n2r_c24:
        large: 8000
        medium: 1000
        small_msg: 20
      2n2r_c24:
        large: 12000
        medium: 2500
        small_msg: 30
        scan_g8_v1: 14
        scan_g8_v2: 13
        scan_g8_v3: 22
        scan_g8_v4: 16
        scan_g8_v6: 27
        scan_g8_v8: 23
        scan_g8_v10: 40
        scan_g8_v12: 62
        scan_g32_v1: 33
        scan_g32_v2: 56
        scan_g32_v4: 30
        scan_g32_v8: 125
        scan_g32_v16: 203
        scan_g32_v32: 202
